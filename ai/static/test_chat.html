<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWise AI Chatbot - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #0f172a;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.error { background: #ef4444; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .stats-bar {
            background: #1e293b;
            padding: 16px 32px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #334155;
        }

        .stat-item { text-align: center; }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-container {
            height: 520px;
            overflow-y: auto;
            padding: 24px;
            background: #0f172a;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { justify-content: flex-end; }

        .message-bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 6px;
        }

        .message-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .message.user .message-meta { justify-content: flex-end; }

        .meta-tag {
            background: #1e293b;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
        }

        .message.user .meta-tag { background: rgba(255,255,255,0.15); }

        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
        }

        .sources-title {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .source-item {
            font-size: 12px;
            color: #60a5fa;
            margin-bottom: 6px;
            padding: 8px 12px;
            background: #1e293b;
            border-radius: 8px;
            border-left: 3px solid #3b82f6;
        }

        .entities {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
        }

        .entity-tag {
            display: inline-block;
            padding: 3px 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 11px;
            color: #a78bfa;
            margin: 2px 4px 2px 0;
        }

        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            max-width: 80px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            margin-right: 4px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-container {
            padding: 20px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            font-size: 14px;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input::placeholder { color: #475569; }
        .input-wrapper input:focus { border-color: #3b82f6; }

        .input-wrapper button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-wrapper button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(59,130,246,0.4);
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .quick-btn {
            padding: 8px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .error-bubble {
            background: #451a1a !important;
            border-color: #7f1d1d !important;
            color: #fca5a5 !important;
        }

        @media (max-width: 640px) {
            .container { border-radius: 16px; }
            .header { padding: 16px 20px; }
            .stats-bar { padding: 12px 16px; }
            .chat-container { height: 400px; padding: 16px; }
            .input-container { padding: 16px; }
            .message-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🤖 ShopWise AI Chatbot</h1>
                <p>RAG Chatbot Tư vấn Sản phẩm &mdash; pgvector + BM25 + PhoBERT</p>
            </div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalProducts">-</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalChunks">-</div>
                <div class="stat-label">Chunks</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="pgvectors">-</div>
                <div class="stat-label">pgvector</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="geminiStatus">-</div>
                <div class="stat-label">Gemini</div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble">
                    Xin chào! 👋 Tôi là trợ lý AI tư vấn sản phẩm công nghệ của ShopWise. Bạn cần tìm sản phẩm nào hoặc có câu hỏi gì?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">Gửi</button>
            </div>
            <div class="quick-questions">
                <button class="quick-btn" onclick="askQuick('Laptop gaming nào tốt nhất?')">🎮 Laptop gaming?</button>
                <button class="quick-btn" onclick="askQuick('Điện thoại Samsung giá bao nhiêu?')">📱 Giá Samsung?</button>
                <button class="quick-btn" onclick="askQuick('Laptop nào cho sinh viên?')">🎓 Laptop sinh viên?</button>
                <button class="quick-btn" onclick="askQuick('Tai nghe chống ồn tốt?')">🎧 Tai nghe chống ồn?</button>
                <button class="quick-btn" onclick="askQuick('Bảo hành sản phẩm như thế nào?')">🛡️ Bảo hành?</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Load stats on startup
        loadStats();

        // Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`);
                if (!response.ok) throw new Error('Stats endpoint failed');
                const data = await response.json();

                document.getElementById('totalProducts').textContent = data.total_products || 0;
                document.getElementById('totalChunks').textContent = data.total_chunks || 0;
                document.getElementById('pgvectors').textContent = data.pgvector_vectors || 0;
                document.getElementById('geminiStatus').textContent = data.gemini_status === 'connected' ? '✅' : '❌';

                document.getElementById('statusDot').classList.remove('error');
                document.getElementById('statusText').textContent = 'Connected';
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('statusDot').classList.add('error');
                document.getElementById('statusText').textContent = 'Disconnected';
            }
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="typing-indicator" style="display: block;">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/api/v1/chat?q=${encodeURIComponent(query)}&top_k=5`);
                const data = await response.json();

                chatContainer.removeChild(typingDiv);

                if (data.error) {
                    addMessage(data.error, 'bot', null, true);
                } else {
                    addMessage(data.answer || data.response || 'Không có phản hồi.', 'bot', data);
                }
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                addMessage('Xin lỗi, có lỗi xảy ra khi kết nối. Vui lòng thử lại.', 'bot', null, true);
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, type, data = null, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let sourcesHtml = '';
            if (data && data.retrieved_products && data.retrieved_products.length > 0) {
                sourcesHtml = `
                    <div class="sources">
                        <div class="sources-title">📚 Sản phẩm liên quan:</div>
                        ${data.retrieved_products.slice(0, 3).map(s => `
                            <div class="source-item">
                                <strong>${s.name || s.product_name || ''}</strong>
                                ${s.price ? ` — ${Number(s.price).toLocaleString('vi-VN')}đ` : ''}
                                ${s.stage1_score ? ` (score: ${s.stage1_score})` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            let entitiesHtml = '';
            if (data && data.entities && data.entities.length > 0) {
                entitiesHtml = `
                    <div class="entities">
                        ${data.entities.map(e => `
                            <span class="entity-tag">🏷️ ${e.text} (${e.entity_type})</span>
                        `).join('')}
                    </div>
                `;
            }

            let metaHtml = '';
            if (data) {
                const intent = data.intent || '';
                const confidence = data.confidence ? `${(data.confidence * 100).toFixed(0)}%` : '';
                const validation = data.validation;
                let validationBadge = '';
                if (validation && validation.warnings && validation.warnings.length > 0) {
                    validationBadge = `<span class="meta-tag" style="color:#fbbf24">⚠️ ${validation.warnings.length} warnings</span>`;
                }

                metaHtml = `
                    <div class="message-meta">
                        ${intent ? `<span class="meta-tag">Intent: ${intent}</span>` : ''}
                        ${confidence ? `<span class="meta-tag">Confidence: ${confidence}</span>` : ''}
                        ${data.retrieved_products ? `<span class="meta-tag">Sources: ${data.retrieved_products.length}</span>` : ''}
                        ${validationBadge}
                    </div>
                `;
            }

            const bubbleClass = isError ? 'message-bubble error-bubble' : 'message-bubble';

            messageDiv.innerHTML = `
                <div class="${bubbleClass}">
                    ${text.replace(/\n/g, '<br>')}
                    ${entitiesHtml}
                    ${sourcesHtml}
                    ${metaHtml}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function askQuick(question) {
            userInput.value = question;
            sendMessage();
        }
    </script>
</body>
</html>
