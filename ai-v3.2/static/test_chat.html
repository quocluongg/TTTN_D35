<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWise AI Chatbot v3.2 - Linked Messages & Product Cards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: #0f172a;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.error { background: #ef4444; animation: none; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        .stats-bar {
            background: #1e293b;
            padding: 16px 32px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #334155;
        }

        .stat-item { text-align: center; }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #3b82f6;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-container {
            height: 520px;
            overflow-y: auto;
            padding: 24px;
            background: #0f172a;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { justify-content: flex-end; }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 6px;
        }

        .message-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .message.user .message-meta { justify-content: flex-end; }

        .meta-tag {
            background: #0f172a;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid #334155;
        }

        .message.user .meta-tag { background: rgba(255,255,255,0.15); border: none; }

        .link-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            background: #0369a1;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }

        .product-card-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 16px;
            border-left: 4px solid #3b82f6;
        }

        .product-card-title {
            font-weight: 700;
            color: #60a5fa;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .product-card-details {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
        }

        .product-card-price {
            font-weight: 700;
            color: #4ade80;
        }

        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
        }

        .sources-title {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .source-item {
            font-size: 12px;
            color: #60a5fa;
            margin-bottom: 6px;
            padding: 8px 12px;
            background: #0f172a;
            border-radius: 8px;
            border-left: 3px solid #3b82f6;
        }

        .entities {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #334155;
        }

        .entity-tag {
            display: inline-block;
            padding: 3px 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 11px;
            color: #a78bfa;
            margin: 2px 4px 2px 0;
        }

        .typing-indicator {
            display: none;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            border-bottom-left-radius: 6px;
            max-width: 80px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            margin-right: 4px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-container {
            padding: 20px 24px;
            background: #1e293b;
            border-top: 1px solid #334155;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 18px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 14px;
            font-size: 14px;
            color: #e2e8f0;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input::placeholder { color: #475569; }
        .input-wrapper input:focus { border-color: #3b82f6; }

        .input-wrapper button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-wrapper button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(59,130,246,0.4);
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .quick-btn {
            padding: 8px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .error-bubble {
            background: #451a1a !important;
            border-color: #7f1d1d !important;
            color: #fca5a5 !important;
        }

        @media (max-width: 640px) {
            .container { border-radius: 16px; }
            .header { padding: 16px 20px; }
            .stats-bar { padding: 12px 16px; }
            .chat-container { height: 400px; padding: 16px; }
            .input-container { padding: 16px; }
            .message-bubble { max-width: 85%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>🤖 ShopWise AI Chatbot v3.2</h1>
                <p>RAG Chatbot Tư vấn &mdash; Line-by-Line Specs & Product Cards</p>
            </div>
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="convIdDisplay" style="font-size:13px; word-break:break-all;">-</div>
                <div class="stat-label">Conversation ID</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="lastMsgIdDisplay" style="font-size:13px; word-break:break-all;">-</div>
                <div class="stat-label">Last Message ID (Parent)</div>
            </div>
            <div class="stat-item">
                <button class="quick-btn" onclick="startNewConversation()" style="margin-top:2px;">🆕 Conversation mới</button>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble">
                    Xin chào anh/chị! 👋 Em là trợ lý tư vấn sản phẩm công nghệ của ShopWise. Anh/chị cần tìm sản phẩm nào hay cần em hỗ trợ thông tin gì ạ?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn (ví dụ: 'Asus Vivobook 15 giá bao nhiêu?')" autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">Gửi</button>
            </div>
            <div class="quick-questions">
                <button class="quick-btn" onclick="askQuick('Laptop ASUS Vivobook 15 giá bao nhiêu?')">💻 ASUS Vivobook 15?</button>
                <button class="quick-btn" onclick="askQuick('Cấu hình của nó gồm những gì?')">🔍 Cấu hình của nó?</button>
                <button class="quick-btn" onclick="askQuick('Nó có bảo hành bao lâu?')">🛡️ Bảo hành bao lâu?</button>
                <button class="quick-btn" onclick="askQuick('So sánh nó với MacBook Air M3')">⚖️ So sánh với MacBook Air M3?</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentConversationId = null;
        let lastMessageId = null;

        // Load stats on startup
        loadStats();

        // Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`);
                if (!response.ok) throw new Error('Stats endpoint failed');
                const data = await response.json();

                document.getElementById('statusDot').classList.remove('error');
                document.getElementById('statusText').textContent = 'Connected';
            } catch (error) {
                console.error('Failed to load stats:', error);
                document.getElementById('statusDot').classList.add('error');
                document.getElementById('statusText').textContent = 'Disconnected';
            }
        }

        function formatMarkdownText(text) {
            if (!text) return '';
            let html = text;
            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Line-by-line Bullet points
            html = html.replace(/^[ \t]*[•\*][ \t]+(.+)$/gm, '<li style="margin-left: 18px; margin-bottom: 4px;">$1</li>');
            // Wrap <li> in <ul>
            html = html.replace(/(<li.*<\/li>\n?)+/g, '<ul style="margin: 8px 0; padding-left: 4px;">$&</ul>');
            // Line breaks
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/<br><ul/g, '<ul').replace(/<\/ul><br>/g, '</ul>');
            return html;
        }

        function startNewConversation() {
            currentConversationId = null;
            lastMessageId = null;
            document.getElementById('convIdDisplay').textContent = '- (Sẽ tự tạo)';
            document.getElementById('lastMsgIdDisplay').textContent = '-';

            const sysMsg = document.createElement('div');
            sysMsg.className = 'message bot';
            sysMsg.innerHTML = `
                <div class="message-bubble" style="background:#0284c7; color:white;">
                    ✨ Đã bắt đầu cuộc trò chuyện mới! Chuỗi tin nhắn đã được khởi tạo lại.
                </div>
            `;
            chatContainer.appendChild(sysMsg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="typing-indicator" style="display: block;">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                let url = `${API_URL}/api/v1/chat?q=${encodeURIComponent(query)}&top_k=5`;
                if (currentConversationId) {
                    url += `&conversation_id=${encodeURIComponent(currentConversationId)}`;
                }
                if (lastMessageId) {
                    url += `&parent_id=${encodeURIComponent(lastMessageId)}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                chatContainer.removeChild(typingDiv);

                if (data.error) {
                    addMessage(data.error, 'bot', null, true);
                } else {
                    // Update linked message pointers
                    if (data.conversation_id) {
                        currentConversationId = data.conversation_id;
                        document.getElementById('convIdDisplay').textContent = currentConversationId.substring(0, 8) + '...';
                    }
                    if (data.message_id) {
                        lastMessageId = data.message_id;
                        document.getElementById('lastMsgIdDisplay').textContent = lastMessageId.substring(0, 8) + '...';
                    }

                    addMessage(data.response || data.answer || 'Không có phản hồi.', 'bot', data);
                }
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                addMessage('Xin lỗi, có lỗi xảy ra khi kết nối. Vui lòng thử lại.', 'bot', null, true);
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, type, data = null, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let linkBadgeHtml = '';
            if (data && data.message_id) {
                const parentText = data.parent_id ? data.parent_id.substring(0, 6) : 'null (root)';
                const msgText = data.message_id.substring(0, 6);
                linkBadgeHtml = `
                    <div class="link-badge">
                        🔗 ID: ${msgText} ⬅️ Parent: ${parentText} ${data.history_length ? `| History: ${data.history_length} turns` : ''}
                    </div>
                `;
            }

            let cardsHtml = '';
            if (data && data.products && data.products.length > 0) {
                cardsHtml = `
                    <div class="product-card-container">
                        ${data.products.map(p => `
                            <div class="product-card">
                                <div class="product-card-title">🛒 ${p.name}</div>
                                <div class="product-card-details">
                                    <span>🏷️ ${p.brand}</span>
                                    <span>📁 ${p.category_name}</span>
                                    <span>⭐ ${p.rating_avg}/5.0 (${p.review_count} lượt)</span>
                                </div>
                                <div class="product-card-price">💰 ${Number(p.price_from).toLocaleString('vi-VN')} VNĐ</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            let entitiesHtml = '';
            if (data && data.entities && data.entities.length > 0) {
                entitiesHtml = `
                    <div class="entities">
                        ${data.entities.map(e => `
                            <span class="entity-tag">🏷️ ${e.text} (${e.entity_type})</span>
                        `).join('')}
                    </div>
                `;
            }

            let metaHtml = '';
            if (data) {
                const intent = data.intent || '';
                const confidence = data.confidence ? `${(data.confidence * 100).toFixed(0)}%` : '';

                metaHtml = `
                    <div class="message-meta">
                        ${intent ? `<span class="meta-tag">Intent: ${intent}</span>` : ''}
                        ${confidence ? `<span class="meta-tag">Confidence: ${confidence}</span>` : ''}
                        ${data.products ? `<span class="meta-tag">Cards: ${data.products.length}</span>` : ''}
                    </div>
                `;
            }

            const bubbleClass = isError ? 'message-bubble error-bubble' : 'message-bubble';
            const formattedContent = type === 'bot' ? formatMarkdownText(text) : text.replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="${bubbleClass}">
                    ${formattedContent}
                    ${cardsHtml}
                    ${linkBadgeHtml}
                    ${entitiesHtml}
                    ${metaHtml}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function askQuick(question) {
            userInput.value = question;
            sendMessage();
        }
    </script>
</body>
</html>
