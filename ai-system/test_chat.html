<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWise RAG Chatbot - Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-bar {
            background: #f8fafc;
            padding: 15px 30px;
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        .chat-container {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e2e8f0;
        }

        .sources-title {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 6px;
        }

        .source-item {
            font-size: 12px;
            color: #667eea;
            margin-bottom: 4px;
            padding: 4px 8px;
            background: #f1f5f9;
            border-radius: 6px;
        }

        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
        }

        .input-wrapper button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-wrapper button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .input-wrapper button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .quick-btn {
            padding: 6px 12px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 12px;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            max-width: 70px;
        }

        .typing-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            margin-right: 4px;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 ShopWise RAG Chatbot</h1>
            <div class="status">
                <div class="status-dot"></div>
                <span>Connected</span>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value" id="totalProducts">-</div>
                <div class="stat-label">Products</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalChunks">-</div>
                <div class="stat-label">Chunks</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="faissVectors">-</div>
                <div class="stat-label">FAISS Vectors</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="geminiStatus">-</div>
                <div class="stat-label">Gemini</div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble">
                    Xin chào! 👋 Tôi là trợ lý AI tư vấn sản phẩm của ShopWise. Bạn muốn hỏi về sản phẩm nào?
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
                <button id="sendBtn" onclick="sendMessage()">Gửi</button>
            </div>
            <div class="quick-questions">
                <button class="quick-btn" onclick="askQuick('Laptop HP RAM bao nhiêu?')">Laptop HP RAM?</button>
                <button class="quick-btn" onclick="askQuick('Giá laptop HP bao nhiêu?')">Giá laptop HP?</button>
                <button class="quick-btn" onclick="askQuick('Laptop nào phù hợp cho làm việc?')">Laptop làm việc?</button>
                <button class="quick-btn" onclick="askQuick('Bảo hành laptop HP?')">Bảo hành?</button>
                <button class="quick-btn" onclick="askQuick('Laptop HP có tốt không?')">HP có tốt?</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001';
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Load stats on startup
        loadStats();

        // Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`);
                const data = await response.json();
                document.getElementById('totalProducts').textContent = data.total_products;
                document.getElementById('totalChunks').textContent = data.total_chunks;
                document.getElementById('faissVectors').textContent = data.faiss_vectors;
                document.getElementById('geminiStatus').textContent = data.gemini_status === 'connected' ? '✅' : '❌';
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            // Add user message
            addMessage(query, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = `
                <div class="typing-indicator" style="display: block;">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query }),
                });

                const data = await response.json();

                // Remove typing indicator
                chatContainer.removeChild(typingDiv);

                // Add bot response
                addMessage(data.response, 'bot', data);
            } catch (error) {
                chatContainer.removeChild(typingDiv);
                addMessage('Xin lỗi, có lỗi xảy ra. Vui lòng thử lại.', 'bot');
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function addMessage(text, type, data = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            let sourcesHtml = '';
            if (data && data.sources && data.sources.length > 0) {
                sourcesHtml = `
                    <div class="sources">
                        <div class="sources-title">📚 Nguồn tham khảo:</div>
                        ${data.sources.map(s => `
                            <div class="source-item">
                                ${s.text}... (score: ${s.score})
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            let metaHtml = '';
            if (data) {
                metaHtml = `
                    <div class="message-meta">
                        Intent: ${data.intent} | Confidence: ${(data.confidence * 100).toFixed(0)}% | Sources: ${data.sources?.length || 0}
                    </div>
                `;
            }

            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${text.replace(/\n/g, '<br>')}
                    ${sourcesHtml}
                    ${metaHtml}
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function askQuick(question) {
            userInput.value = question;
            sendMessage();
        }
    </script>
</body>
</html>
